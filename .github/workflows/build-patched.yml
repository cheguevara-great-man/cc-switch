name: Build Patched EXE

on:
  push:
    branches:
      - fix/thought-signature-v2
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '10.12.3'
          run_install: false

      - name: Install frontend deps
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Tauri (frontend + backend)
        shell: bash
        run: pnpm tauri build

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: cc-switch-patched
          path: src-tauri/target/release/cc-switch.exe
