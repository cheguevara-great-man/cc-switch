name: Build Patched EXE

on:
  push:
    branches:
      - fix/thought-signature
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Install frontend deps
        shell: pwsh
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust library (including Gemini thought signatures)
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build Tauri (frontend + backend)
        shell: pwsh
        # Build the embedded frontend and Rust backend, but skip MSI/NSIS
        # bundling because this private patch branch does not own the upstream
        # Tauri updater signing key.
        run: pnpm tauri build --no-bundle --config src-tauri/tauri.conf.json 2>&1

      - name: Find and upload EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter "cc-switch.exe" | Where-Object { $_.FullName -like "*release*" } | Select-Object -First 1
          Write-Host "EXE: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: cc-switch-patched
          path: src-tauri/target/release/cc-switch.exe
